name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Web Assets in www Directory
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp -f index.html www/index.html
          fi
          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html not found!"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          npm install || true

      - name: Add Android Platform
        run: |
          npx cap add android || npx @capacitor/cli add android || echo "Android platform ready"

      - name: Sync Web Assets into Android Project
        run: |
          npx cap sync android || npx @capacitor/cli sync android

      - name: Inject Native Bridge from Root Files
        run: |
          mkdir -p android/app/src/main/java/com/optimalsurgicals/quotationapp/
          mkdir -p android/app/src/main/res/xml/
          if [ -f MainActivity.java ]; then
            cp -f MainActivity.java android/app/src/main/java/com/optimalsurgicals/quotationapp/MainActivity.java
          fi
          if [ -f file_paths.xml ]; then
            cp -f file_paths.xml android/app/src/main/res/xml/file_paths.xml
          fi
          if [ -f AndroidManifest.xml ]; then
            cp -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Optimal-Command-v11.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Optimal-Command-v11.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v11.0.0
          name: "Optimal Command v11.0 Enterprise Suite"
          body: "Direct APK download with native gallery writing, FileProvider sharing, and pure-JS PDF engine."
          files: Optimal-Command-v11.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
