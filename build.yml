name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # AUTO-HEALING STEP: Guarantees www/index.html always exists
      - name: Ensure Web Assets in www Directory
        run: |
          echo "=== Verifying / Creating www Web Assets Directory ==="
          mkdir -p www
          if [ -f index.html ]; then
            cp -f index.html www/index.html
            echo "Copied root index.html to www/index.html"
          fi
          if [ -d public ]; then
            cp -r public/* www/ 2>/dev/null || true
          fi
          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html could not be found!"
            exit 1
          fi
          echo "www/index.html verified successfully: $(ls -lh www/index.html)"

      - name: Install Dependencies
        run: |
          npm install || true

      - name: Add Android Platform
        run: |
          npx cap add android || npx @capacitor/cli add android || echo "Android platform ready"

      - name: Sync Web Assets into Android Project
        run: |
          npx cap sync android || npx @capacitor/cli sync android

      # NATIVE BRIDGE INJECTION STEP: Injects AndroidBridge, FileProvider, and MediaStore Gallery Save
      - name: Inject Native Android Bridge, Permissions & FileProvider
        run: |
          echo "=== INJECTING NATIVE ANDROID BRIDGE & PERMISSIONS ==="
          mkdir -p android/app/src/main/java/com/optimalsurgicals/quotationapp/
          mkdir -p android/app/src/main/res/xml/

          # 1. Inject MainActivity.java
          if [ -f capacitor_bridge_src/MainActivity.java ]; then
            cp -f capacitor_bridge_src/MainActivity.java android/app/src/main/java/com/optimalsurgicals/quotationapp/MainActivity.java
            echo "Injected from capacitor_bridge_src/MainActivity.java"
          elif [ -f MainActivity.java ]; then
            cp -f MainActivity.java android/app/src/main/java/com/optimalsurgicals/quotationapp/MainActivity.java
            echo "Injected from root MainActivity.java"
          fi

          # 2. Inject file_paths.xml
          if [ -f capacitor_bridge_src/file_paths.xml ]; then
            cp -f capacitor_bridge_src/file_paths.xml android/app/src/main/res/xml/file_paths.xml
            echo "Injected from capacitor_bridge_src/file_paths.xml"
          elif [ -f file_paths.xml ]; then
            cp -f file_paths.xml android/app/src/main/res/xml/file_paths.xml
            echo "Injected from root file_paths.xml"
          fi

          # 3. Inject AndroidManifest.xml
          if [ -f capacitor_bridge_src/AndroidManifest.xml ]; then
            cp -f capacitor_bridge_src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "Injected from capacitor_bridge_src/AndroidManifest.xml"
          elif [ -f AndroidManifest.xml ]; then
            cp -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "Injected from root AndroidManifest.xml"
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk Optimal-Intelligence-v22.apk
          ls -lh Optimal-Intelligence-v22.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: Optimal-Intelligence-v22.apk
          retention-days: 30

      # BULLETPROOF RELEASE STEP: Uses softprops with continue-on-error and GitHub CLI fallback
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v22.0.1
          name: "Optimal Intelligence v22.0 Supreme Master Suite (135 Tools)"
          body: "Direct 1-click APK release for Optimal Intelligence Supreme Master Suite v22.0 with 135 specialized tools: AI BOQ Tender Payment Delay Engine, Turnkey Corporate Profile & Product Catalog Studio, Cleanroom HVAC Sizing, Biomedical Safety Calibration, GeM L1 Reverse Auction Engine, Anti-Theft Copyright Watermarking, Photo & PDF Stamping, and Finger Edge Swipe Navigation for S.S. Razvi."
          files: Optimal-Intelligence-v22.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback Release Publishing via GitHub CLI
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (steps.create_release.outcome == 'failure' || steps.create_release.outcome == 'skipped')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Publishing via GitHub CLI Fallback ==="
          TAG="v22.0.1"
          TITLE="Optimal Intelligence v22.0 Supreme Master Suite (135 Tools)"
          BODY="Direct 1-click APK release for Optimal Intelligence Supreme Master Suite v22.0 with 135 specialized tools."
          
          gh release upload "$TAG" Optimal-Intelligence-v22.apk --clobber || \
          gh release create "$TAG" Optimal-Intelligence-v22.apk --title "$TITLE" --notes "$BODY" --latest || \
          echo "Release created or already exists."
